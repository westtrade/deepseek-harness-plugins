<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Harness</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #12121a;
        color: #e8e8f0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #frameWrap {
        position: relative;
        flex: 1;
        overflow: hidden;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #ffffff;
      }
      #loading,
      .center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #12121a;
        text-align: center;
        padding: 24px;
      }
      .spinner {
        width: 42px;
        height: 42px;
        border: 4px solid rgba(255, 255, 255, 0.18);
        border-top-color: #7c74ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #lastLine {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: #8a8aa0;
        max-width: 80%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-height: 18px;
      }
      button {
        padding: 8px 16px;
        border: 0;
        border-radius: 6px;
        background: #7c74ff;
        color: white;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        opacity: 0.92;
      }
    </style>
  </head>
  <body>
    <div id="frameWrap">
      <div id="loading">
        <div class="spinner"></div>
        <h3 id="status">Инициализация...</h3>
        <div id="lastLine"></div>
      </div>
    </div>

    <script src="/neutralino.js"></script>
    <script src="/js/main.js"></script>
  </body>
</html>
